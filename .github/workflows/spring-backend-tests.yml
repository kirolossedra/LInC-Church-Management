name: Spring Backend Tests

on:
  push:
    paths:
      - "backend-spring/**"
      - ".github/workflows/spring-backend-tests.yml"

  pull_request:
    paths:
      - "backend-spring/**"
      - ".github/workflows/spring-backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run Spring Boot automated tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-spring

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-spring/pom.xml

      - name: Run Spring Boot tests and package
        run: mvn --batch-mode --no-transfer-progress clean verify
