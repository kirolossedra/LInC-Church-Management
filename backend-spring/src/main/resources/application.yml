spring:
  application:
    name: churchone-spring-backend
  main:
    banner-mode: "off"

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

app:
  version: ${APP_VERSION:0.0.2}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://lincministry.com,http://localhost:5173}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    database-url: ${FIREBASE_DATABASE_URL:}
    service-account-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    check-revoked-tokens: ${FIREBASE_CHECK_REVOKED_TOKENS:false}
    role-lookup-timeout: ${FIREBASE_ROLE_LOOKUP_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
