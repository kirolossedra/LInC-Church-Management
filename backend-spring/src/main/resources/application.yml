spring:
  application:
    name: churchone-spring-backend
  main:
    banner-mode: "off"

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

app:
  version: ${APP_VERSION:0.0.1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://lincministry.com,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: INFO
